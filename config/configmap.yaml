apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config

data:
  SPRING_PROFILES_ACTIVE: "docker"

  AUTH_DB_URL: "jdbc:postgresql://auth-db:5432/auth_service"
  USER_DB_URL: "jdbc:postgresql://user-db:5432/user_service"
  ORDER_DB_URL: "jdbc:postgresql://order-db:5432/order_service"
  PAYMENT_DB_URL: "jdbc:postgresql://payment-db:5432/payment_service"

  USER_SERVICE_URL: "http://user-service:8080"
  AUTH_SERVICE_URL: "http://auth-service:8080"
  ORDER_SERVICE_URL: "http://order-service:8080"
  PAYMENT_SERVICE_URL: "http://payment-service:8080"

  KAFKA: "kafka:9092"
  KAFKA_POSTGRES: "kafka:29092"